
services:
  db:
    image: postgres:16
    container_name: talentsync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: talentsync
    ports:
      - "5432:5432"
    volumes:
      - talentsync_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d talentsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: talentsync-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      DATABASE_URL: "postgresql://dev:devpass@db:5432/talentsync?schema=public"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]

  frontend:
    build:
      context: ./talentsync
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
    container_name: talentsync-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  talentsync_data:
